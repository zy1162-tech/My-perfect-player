<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生涯事件功能验证</title>
<style>
body{margin:0;background:#f4f1eb;font:14px system-ui;color:#17283d}header{padding:12px;background:white;border-bottom:1px solid #ddd}button{padding:10px 14px;margin:3px;border:1px solid #bcc4cd;background:#fff;border-radius:7px;cursor:pointer}#report{font-size:12px;line-height:1.5;white-space:pre-wrap;max-height:140px;overflow:auto}iframe{display:block;width:100%;height:calc(100vh - 140px);border:0}p{margin:5px 0}
</style>
<header>
<strong>生涯事件功能验证 · 测试用角色</strong>
<p>使用独立本地端口运行，实际调用正式页面的模拟、事件、教练和存档函数。</p>
<select id="layout-width" aria-label="验证布局宽度" onchange="document.getElementById('game').style.width=this.value==='auto'?'100%':this.value+'px'"><option value="auto">桌面宽度</option><option value="1440">PC 1440</option><option value="390">手机 390</option><option value="320">手机 320</option></select>
<select id="roster-era" aria-label="阵容验证年代"><option value="current">现代</option><option value="2003">2003</option><option value="2010">2010</option><option value="2016">2016</option></select>
<select id="roster-team" aria-label="阵容验证球队"><option value="PHI">PHI 费城</option><option value="BOS">BOS 波士顿</option><option value="LAL">LAL 洛杉矶</option><option value="CHA">CHA 夏洛特</option></select>
<button onclick="prepareRosterSmoke()">展示真实建球名单</button>
<button onclick="prepareCareerSmoke()">准备正常赛季验证</button>
<button onclick="prepareMedicalSmoke()">准备恢复事件验证</button>
<button onclick="prepareCurrentRecoverySmoke()">继续检查恢复联动</button>
<button onclick="prepareCoachSmoke()">准备教练与账本验证</button>
<button onclick="prepareBranchContinuitySmoke()">准备旧剧情读档验证</button>
<select id="salary-era" aria-label="工资验证场景"><option value="veteran">现代十年资历巨星</option><option value="current">现代状元新秀</option><option value="2003">2003 状元新秀</option><option value="2010">2010 状元新秀</option><option value="2016">2016 状元新秀</option></select>
<button onclick="prepareSalarySmoke()">准备年代工资验证</button>
<button onclick="advanceCoachSmoke()">继续检查团队联动</button>
<button onclick="gameWindow.showTeamSystemChooser()">检查更换球队体系</button>
<button onclick="showCareerOverviewSmoke()">查看实际生涯面板</button>
<button onclick="saveCareerSmoke()">保存测试进度</button>
<button onclick="loadCareerSmoke()">恢复测试进度</button>
<button onclick="reportCareerSmoke()">读取实际结果</button>
<div id="report">等待准备。</div>
</header>
<iframe id="game" src="../nba-perfect-player.html?career-events-smoke=20261004-pc-rosters-v9" title="正式游戏"></iframe>
<script>
var gameWindow, gameState, smokeResult = [], nextCoachStep = 0, savedCareerSmoke = null, branchContinuity = null;
async function prepareCareerSmokeBase(ovr) {
  gameWindow = document.getElementById('game').contentWindow;
  if (!gameWindow.__PP_ensure) throw new Error('页面仍在加载，请稍后准备');
  await gameWindow.__PP_ensure(['create','career','story','live']);
  gameWindow.initGame();
  // 原页面用顶层 const 保存状态；测试页读取该绑定，不为测试给正式页面增加接口。
  var s = gameWindow.eval('STATE');
  gameState = s;
  s.mode = 'current'; s.eraStart = null; s.position = 'SG'; s.careerTeam = 'LAL';
  s.career = gameWindow.createFreshCareer();
  s.attrs = Object.fromEntries(['FIN','MID','threePT','DNK','HAN','PAS','PDEF','IDEF','REB','BLK','STL','ATH','STR','CLU','STA'].map(k=>[k,k==='STA'?0:ovr]));
  s.finalOVR = gameWindow.calcOVR(s.attrs, 'SG');
  gameWindow.eval('HUPU_USER').nickname = '生涯验证球员';
  gameWindow.PERFECT_PLAYER_PROFILE = {name:'生涯验证球员',avatar:gameWindow.getHupuAvatarUrl()};
  smokeResult = [];
  savedCareerSmoke = null;
  branchContinuity = null;
  return s;
}
async function prepareCareerSmoke() {
  try {
    await prepareCareerSmokeBase(80);
    gameWindow.startSeason();
    document.getElementById('report').textContent = '正常赛季已启动。请在下方赛前面板模拟本场，随后选择真实事件。';
  } catch(e) { document.getElementById('report').textContent = 'FAIL '+e.message; }
}
async function prepareRosterSmoke() {
  try {
    var s=await prepareCareerSmokeBase(80), era=document.getElementById('roster-era').value, team=document.getElementById('roster-team').value;
    s.mode=era==='current'?'current':'legend';s.eraStart=era==='current'?null:Number(era);
    if(s.mode==='legend')gameWindow.applyLegendEraLeague();
    gameWindow.beginAttributeBuild();
    var players=gameWindow.getBuildPlayerPool(team);
    s.currentTeam=team;s._drawPlayers=players;
    gameWindow.showScreen('screen-build');
    gameWindow.renderRosterPlayers(team,players,players);
    document.getElementById('report').textContent=JSON.stringify({era:era,team:team,count:players.length,players:players.map(p=>({name:p.nameEN||p.name,ovr:p.ovr,estimated:/estimate/.test(p.ratingBasis||'')}))},null,2);
  } catch(e) { document.getElementById('report').textContent='FAIL '+e.message; }
}
async function prepareMedicalSmoke() {
  try {
    var s = await prepareCareerSmokeBase(96);
    s.season = { games:[], schedule:[{opponent:'BOS',home:true,day:0}], playerStats:{games:0}, playoffStats:{games:0}, events:{injuryGamesLeft:0} };
    var e = gameWindow.PP_CAREER_EVENTS.getState();
    e.pending = {id:'recovery_plan',key:'medical-ui',opponent:'BOS'};
    gameWindow.showCareerExperienceDecision();
    document.getElementById('report').textContent = '请选择恢复安排，再读取结果；将实际运行一场直接模拟和一场观看引擎比赛。';
  } catch(e) { document.getElementById('report').textContent = 'FAIL '+e.message; }
}
async function prepareCoachSmoke() {
  try {
    var s = await prepareCareerSmokeBase(80);
    s.season = {games:[],schedule:Array.from({length:82},(_,i)=>({opponent:'BOS',day:i,home:true})),playerStats:{games:0},playoffStats:{games:0},events:{injuryGamesLeft:0}};
    var e = gameWindow.PP_CAREER_EVENTS.getState();
    e.pending = {id:'brand_day',key:'brand-ui',opponent:'BOS'};
    nextCoachStep = 0;
    gameWindow.showCareerExperienceDecision();
    document.getElementById('report').textContent = '依次验证拍摄收入、团队支出、默契与教练解锁。';
  } catch(e) { document.getElementById('report').textContent = 'FAIL '+e.message; }
}
function advanceCoachSmoke() {
  var e = gameWindow.PP_CAREER_EVENTS.getState();
  if (e.pending) { document.getElementById('report').textContent = '请先完成当前选择。'; return; }
  if (nextCoachStep >= 2) { gameWindow.openCareerCoachSearch(); return; }
  e.pending = {id:nextCoachStep === 0 ? 'team_evening' : 'rotation_identity',key:'coach-step-'+nextCoachStep,opponent:'BOS'};
  nextCoachStep++;
  gameWindow.showCareerExperienceDecision();
}
function showCareerOverviewSmoke() {
  gameWindow.PP_CAREER_EVENTS.resetTransient();
  gameWindow.eval('regularSeasonRun = null');
  gameWindow.renderSeasonScreenDOM();gameWindow.showScreen('screen-season');
}
function prepareCurrentRecoverySmoke() {
  var e=gameWindow.PP_CAREER_EVENTS.getState();
  gameWindow.PP_CAREER_EVENTS.resetTransient();
  var stage=e.arcs.recovery||0,id=['recovery_plan','recovery_review','recovery_habit'][stage];
  if(!id)return;
  e.pending={id:id,key:'recovery-after-business-'+stage,opponent:'BOS'};
  gameWindow.showCareerExperienceDecision();
}
async function prepareBranchContinuitySmoke() {
  try {
    var s = await prepareCareerSmokeBase(80);
    gameWindow.startSeason();
    // 等真实模拟停在赛前，再结束测试前的回调，使用读档路径重新续接。
    for (var i = 0; i < 100 && !gameWindow.document.getElementById('career-pregame-modal'); i++) {
      await new Promise(resolve => setTimeout(resolve, 50));
    }
    if (!gameWindow.document.getElementById('career-pregame-modal')) throw new Error('正式模拟没有进入赛前');
    gameWindow.PP_CAREER_EVENTS.resetTransient();
    s.career.currentAge = 35;
    var event = gameWindow.getBranchEventById('fan_culture_score');
    branchContinuity = {beforeRisk:gameWindow.getSeasonInjuryEventRate(),attrs:JSON.stringify(s.attrs),ovr:s.finalOVR};
    gameWindow.showSeasonBranchEvent(event);
    await gameWindow.manualSaveGame(1);
    // 重现旧版真实存档格式：事件对象经过 JSON 后已经没有 apply 函数。
    var snapshot = gameWindow.buildManualSaveSnapshot();
    snapshot.v = 1;
    snapshot.state._seasonBranchEvent = JSON.parse(JSON.stringify(event));
    delete snapshot.state._seasonBranchEventId;
    await gameWindow.storageSet(gameWindow.eval('MANUAL_SAVE_KEYS[0]'), JSON.stringify(snapshot));
    await gameWindow.manualLoadGame(1);
    document.getElementById('report').textContent = '已通过正式读档恢复旧剧情。选择“把评分当成镜子”，继续后模拟一场，再读取实际结果；伤病率应立即从 2.2 降到 1.2，剧情记录只应增加一次。';
  } catch(e) { document.getElementById('report').textContent = 'FAIL '+e.message; }
}
async function prepareSalarySmoke() {
  try {
    var s = await prepareCareerSmokeBase(96);
    var scene = document.getElementById('salary-era').value;
    if (scene !== 'current') {
      s.mode = 'legend'; s.eraStart = scene === 'veteran' ? 2016 : Number(scene);
      gameWindow.applyLegendEraLeague();
    }
    if (scene === 'veteran') {
      s.career.seasonCount = 10; s.career.currentAge = 29; s.career.contract = 3;
      gameWindow.PP_CAREER_EVENTS.renewContract({sameTeam:true});
    } else {
      s._draftPending = {round:1,pick:1,type:'lottery',contractYears:4};
      gameWindow.finalizeDraft('LAL');
    }
    gameWindow.startSeason();
    document.getElementById('report').textContent = '已按正式签约入口准备。可展开赛前收支查看工资帽、资历与税前年薪；模拟比赛后读取实际到账金额。';
  } catch(e) { document.getElementById('report').textContent = 'FAIL '+e.message; }
}
function careerSmokeSaveFields() {
  var e = gameWindow.PP_CAREER_EVENTS.getState();
  return {cash:e.money.cash,earned:e.money.earned,effects:e.effects,task:e.task,pending:e.pending,
    awaitingGameKey:e.awaitingGameKey,coaches:e.coaches,ovr:gameState.finalOVR,attrs:gameState.attrs};
}
async function saveCareerSmoke() {
  savedCareerSmoke = JSON.stringify(careerSmokeSaveFields());
  await gameWindow.manualSaveGame(1);
  document.getElementById('report').textContent = '正式保存已完成，可以恢复测试进度。';
}
async function loadCareerSmoke() {
  await gameWindow.manualLoadGame(1);
  document.getElementById('report').textContent = '正式读档已完成，可读取实际结果检查余额、效果与角色是否保留。';
}
function reportCareerSmoke() {
  try {
    var s = gameState, e = gameWindow.PP_CAREER_EVENTS.getState();
    var fx = gameWindow.PP_CAREER_EVENTS.getModifiers();
    if (fx.limit < 42) {
      var direct = gameWindow.skipUserGamePack('BOS',false,0,1,s.attrs);
      var watched = gameWindow.PP_LIVE.run('LAL','BOS',{attrs:s.attrs});
      smokeResult.push({check:'真实分钟上限',limit:fx.limit,direct:direct.stats.mins,watched:watched.stats.mins,
        passed:direct.stats.mins<=fx.limit && watched.stats.mins<=fx.limit});
    }
    var rows = (s.season.games||[]).map((entry,i)=>({game:i+1,opponent:entry.game&&entry.game.opponent,day:entry.game&&entry.game.day,minutes:entry.stats&&entry.stats.mins,points:entry.stats&&entry.stats.pts}));
    var continuity = branchContinuity ? {beforeRisk:branchContinuity.beforeRisk,currentRisk:gameWindow.getSeasonInjuryEventRate(),node:gameWindow.getBranchNode('fan_culture'),
      choiceCount:s.career.branchHistory.filter(row=>row.eventId==='fan_culture_score').length,
      attrsPreserved:branchContinuity.attrs===JSON.stringify(s.attrs),ovrPreserved:branchContinuity.ovr===s.finalOVR,pendingEvent:s._seasonBranchEventId} : null;
    document.getElementById('report').textContent = JSON.stringify({salaryMarket:gameWindow.getCareerSalaryMarket(),annualSalary:e.money.annualSalary,salaryContract:e.money.contract,continuity:continuity,scheduledResults:(s.season.schedule||[]).filter(game=>game.simulated).length,saveRestored:savedCareerSmoke ? savedCareerSmoke===JSON.stringify(careerSmokeSaveFields()) : null,cash:e.money.cash,earned:e.money.earned,salary:e.money.salary,
      offcourt:e.money.offcourt,spent:e.money.spent,modifiers:fx,injuryRate:gameWindow.getSeasonInjuryEventRate(),rotationPlan:gameWindow.getPlayerRotationPlan(s.attrs,s.position,false),chemistry:gameWindow.getCareerExperienceChemistry(),coach:gameWindow.getTeamSystemEffects('LAL').name,
      coachRecord:e.coaches[s.careerTeam]||null,authority:gameWindow.PP_CAREER_EVENTS.getCoachAuthority(),effects:e.effects,task:e.task,feedback:e.feedback,games:rows,checks:smokeResult},null,2);
  } catch(e) { document.getElementById('report').textContent = 'FAIL '+e.message; }
}
</script>
</html>
