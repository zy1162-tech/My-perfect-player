<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>头像与年代评分检查 · Perfect Player</title>
<style>
body{margin:0;padding:24px;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f2ea;color:#2d241c}h1{font-size:24px;margin:0 0 12px}h2{font-size:18px;margin:28px 0 12px}.group{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;text-align:center}.photo{margin:0 auto 10px;border:1px solid #eee;border-radius:50%}.name{font-size:14px;font-weight:700;margin:8px 0}.rating{font-size:21px;font-weight:700;color:#d65d25}.note{font-size:12px;color:#6b6159;line-height:1.5}#status{padding:12px;background:#fff;border-radius:8px}iframe{display:none}
</style>
<h1>头像与年代评分检查</h1>
<p class="note">直接调用正式页面的评分、开局和头像函数，使用独立测试名单，保留现有生涯存档。</p>
<div id="status">正在加载正式页面…</div><div id="gallery"></div>
<iframe id="game" src="../nba-perfect-player.html?v=20261002-courtside-ui-v26"></iframe>
<script>
(async function(){
  const frame=document.getElementById('game');
  await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
  const w=frame.contentWindow;
  const deadline=Date.now()+30000;
  while(!w.__PP_booted){if(Date.now()>deadline)throw Error('正式页面加载超时');await new Promise(resolve=>setTimeout(resolve,50));}
  if(w.PERFECT_PLAYER_DATA_READY)await w.PERFECT_PLAYER_DATA_READY;
  const state=w.eval('STATE'),teams=w.eval('NBA2K_TEAMS'),data=w.eval('NBA2K_DATA');
  const checks=[];
  function assert(condition,message){if(!condition)throw Error(message);}
  async function portrait(player){
    const style=w.getPlayerHeadshotStyle(player,80);
    const node=w.document.createElement('div');node.style.cssText=style;w.document.body.appendChild(node);
    const sources=w.getPlayerHeadshotSources(player),url=sources.local[0]||sources.remote[0];
    assert(url,'没有可用照片：'+player.name);
    const image=new w.Image();image.src=url;await image.decode();
    const computed=w.getComputedStyle(node);
    assert(computed.backgroundColor==='rgb(255, 255, 255)','照片背景不为白色');
    assert(!computed.backgroundImage.includes('data:image/svg+xml'),'真人照片后不能叠字母');
    const result={backgroundImage:computed.backgroundImage,backgroundColor:computed.backgroundColor};node.remove();return result;
  }
  function group(title){const h=document.createElement('h2');h.textContent=title;document.getElementById('gallery').appendChild(h);const section=document.createElement('section');section.className='group';document.getElementById('gallery').appendChild(section);return section;}
  async function card(section,player,note){
    const tile=document.createElement('article');tile.className='card';const avatar=document.createElement('div');avatar.className='photo';Object.assign(avatar.style,await portrait(player),{width:'80px',height:'80px',backgroundSize:'cover',backgroundPosition:'center top'});
    const name=document.createElement('div');name.className='name';name.textContent=player.cname||player.name;
    const rating=document.createElement('div');rating.className='rating';rating.textContent=player.ovr!=null?player.ovr:'已补照片';
    const text=document.createElement('div');text.className='note';text.textContent=note;tile.append(avatar,name,rating,text);section.appendChild(tile);
  }
  const expected={2003:{'Kevin Garnett':97,'Tim Duncan':96,'Kobe Bryant':96},2010:{'Derrick Rose':94,'Dwight Howard':95,'Kevin Durant':94,'Stephen Curry':82},2016:{'Stephen Curry':95,'James Harden':96,'Kawhi Leonard':96,'LeBron James':97}};
  for(const [era,stars]of Object.entries(expected)){
    w.initGame();state.mode='legend';state.eraStart=Number(era);w.applyLegendEraLeague();
    const all=teams.flatMap(team=>data[team]||[]),section=group(era+' 年代 · '+all.filter(p=>p.ovr>=90).length+' 名球员达到90分');
    for(const [name,ovr]of Object.entries(stars)){const player=all.find(p=>p.name===name);assert(player&&player.ovr===ovr,name+' 评分错误');await card(section,player,'当季评分；原卡 '+player._sourceOvr+' 分保留');}
    checks.push({era:Number(era),above90:all.filter(p=>p.ovr>=90).length});
  }
  const registry=w.__PP_VERIFIED_HEADSHOTS__;
  const selected=['marcusmorris','jamesmichael','mettaWorld'.toLowerCase(),'brycecotton','adamflagler','christiankoloko'];
  const section=group('补齐照片 · 官方来源与明确别名');
  for(const key of selected){const record=registry.players[key];if(record)await card(section,{name:record.name,photoLocal:record.p,photoUrl:record.p,nbaId:record.nbaId},'真人照片 · 纯白背景');}
  assert(w.resolveVerifiedLocalPlayerHeadshot({name:'Marcus Morris',_eraGenerated:true})==='','虚构新人不能使用真人头像');
  const generated=w.getPlayerHeadshotStyle({name:'Avatar Test Generated',_eraGenerated:true},40);assert(generated.includes('data:image/svg+xml'),'缺图的虚构新人应保留缩写');
  document.getElementById('status').textContent='通过：年代评分、白底照片、照片解码与虚构新人隔离。';
  document.getElementById('status').dataset.result='passed';
  const output=document.createElement('pre');output.id='checks';output.textContent=JSON.stringify(checks);document.body.appendChild(output);
})().catch(error=>{document.getElementById('status').textContent='失败：'+error.message;document.getElementById('status').dataset.result='failed';});
</script>
</html>
